[project]
name = "vault-agent"
version = "0.1.0"
description = "Claude Agent SDK app for Obsidian vault maintenance (tags, links, stubs, MOCs)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lauri Gates", email = "lauri.gates@forumvirium.fi" }
]
requires-python = "==3.14.7"
keywords = ["claude", "agent-sdk", "cli", "obsidian", "vault", "markdown", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "claude-agent-sdk==0.1.61",
    "python-frontmatter==1.1.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.24.1",
]

[project.urls]
Homepage = "https://github.com/laurigates/vault-agent"
Repository = "https://github.com/laurigates/vault-agent"
Issues = "https://github.com/laurigates/vault-agent/issues"

[project.scripts]
vault-agent = "vault_agent.main:app"

[build-system]
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    # Pinned: formatting output is version-sensitive, so an unpinned floor lets a
    # newer ruff reformat code CI has already accepted. laurigates/claude-plugins
    # pins the same version on its pre-commit and CI surfaces.
    "ruff==0.15.8",
]
